version: '3.8'

services:
  api:
    build: .
    container_name: car_price_api
    ports:
      - "9005:8005"
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/carprice
    volumes:
      - ./models:/app/models:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mlops_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    image: postgres:15-alpine
    container_name: car_price_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: carprice
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - mlops_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d carprice"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

networks:
  mlops_net:
    driver: bridge
